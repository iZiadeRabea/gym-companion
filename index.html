<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a1425"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="رفيق الجيم"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>رفيق الجيم | Gym Companion</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:#e8f0fa;background:#091321;font-size:15px;--ink:#e8f0fa;--muted:#a9b9cd;--line:#273b55;--panel:#142238;--panel2:#192a42;--accent:#55e0c1;--warning:#ffca7a;--red:#ff929b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0,#193650 0,transparent 36%),#091321}.shell{max-width:720px;margin:auto;padding:20px 16px 102px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:23px}h1{font-size:1.65rem;margin:3px 0 0}h2{font-size:1.17rem;margin:0 0 10px}h3{font-size:1rem;margin:0 0 8px}p{line-height:1.75}.small{font-size:.84rem;color:var(--muted)}.eyebrow{color:var(--accent);font-size:.77rem;letter-spacing:.08em;font-weight:700}.card{background:linear-gradient(140deg,#17283f,#111e32);border:1px solid #2d425b;border-radius:20px;padding:17px;margin:0 0 14px;box-shadow:0 10px 24px #00000018}.accent-card{background:linear-gradient(135deg,#17514b,#173247 60%,#17283f);border-color:#367e77}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#293c55;color:#dce9f5;font-size:.78rem}.pill.good{background:#164d46;color:#a4f6e3}.pill.warn{background:#513d25;color:#ffe0a4}.pill.bad{background:#5c2935;color:#ffc1c5}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}.muted{color:var(--muted)}.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{background:#101f34;padding:13px 9px;border-radius:15px;text-align:center;border:1px solid #28415a}.stat strong{display:block;font-size:1.34rem;color:var(--accent);margin-bottom:4px}.stat span{font-size:.72rem;color:var(--muted)}button,select,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}.btn{border:0;background:var(--accent);color:#09282c;font-weight:750;border-radius:12px;padding:12px 15px;min-height:44px}.btn.secondary{background:#29415c;color:#eef7ff}.btn.ghost{background:transparent;border:1px solid #46627c;color:#e7f4ff}.btn.danger{background:#773843;color:#fff}.btn.smallbtn{padding:8px 11px;min-height:34px;font-size:.81rem}.buttons{display:flex;gap:8px;flex-wrap:wrap}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:.86rem;color:#c5d6e8}input,select,textarea{border:1px solid #3c5572;border-radius:11px;background:#0c1c30;color:#eff8ff;min-height:43px;padding:9px 10px;width:100%;outline-color:var(--accent)}input[type=number]{direction:ltr;text-align:center}textarea{resize:vertical}input[type=checkbox]{width:18px;min-height:18px;accent-color:var(--accent)}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.alert{border-radius:13px;padding:11px 13px;border:1px solid #6a4b36;background:#46372b;color:#ffe3b9;line-height:1.6;font-size:.9rem}.alert.red{background:#422934;border-color:#844456;color:#ffcfda}.alert.good{background:#123f3d;border-color:#32786d;color:#acf4e4}.item{padding:12px 0;border-bottom:1px solid #2e4258}.item:last-child{border-bottom:0}.itemtitle{font-weight:700}.setrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;padding:8px 0}.setrow .field{margin:0}.setrow label{font-size:.73rem}.setrow select{font-size:.78rem}.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid #446079;background:#1c324d;color:#e4f1ff;padding:9px 12px;border-radius:30px}.chip.active{background:var(--accent);border-color:var(--accent);color:#0d2930}.nav{position:fixed;bottom:0;right:0;left:0;background:#101d30ed;backdrop-filter:blur(15px);border-top:1px solid #314760;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{background:transparent;border:0;color:#9eb3ca;display:grid;justify-items:center;gap:3px;font-size:.71rem;padding:5px 2px;min-height:51px}.nav button.active{color:var(--accent)}.nav span{font-size:1.17rem}.hidden{display:none!important}.bar{height:11px;background:#33465a;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:var(--accent);border-radius:20px}.progressrow{margin:16px 0}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{border-right:3px solid var(--accent);padding-right:10px;color:#c1d4e5;font-size:.87rem}.hr{border:0;border-top:1px solid #2f435d;margin:15px 0}.hintblock{background:#112d35;padding:11px;border-radius:11px;border:1px solid #276561;color:#bcf1e6}.readonly{opacity:.7}.toast{position:fixed;bottom:91px;left:15px;right:15px;max-width:470px;margin:auto;background:#367c72;border-radius:13px;padding:12px;text-align:center;box-shadow:0 5px 20px #0007;z-index:12}.overline{font-size:.72rem;text-transform:uppercase;color:#9ab1c8;letter-spacing:.08em}.empty{padding:21px 8px;text-align:center;color:#a6bad1}.nowrap{white-space:nowrap}@media(min-width:620px){.shell{padding:30px 24px 110px}.card{padding:20px}}
.timer-panel{border-color:#338b80;background:linear-gradient(135deg,#103b3a,#172c43)}.timer-face{font-size:2.7rem;direction:ltr;letter-spacing:.07em;display:block;text-align:center;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:800;margin:10px 0}.timing-hint{border:1px solid #34566c;border-radius:12px;background:#10293b;padding:10px;font-size:.84rem;color:#d2e5ec;margin:8px 0}.timingrow{padding:6px 0 12px;border-bottom:1px solid #2e4258}.timingrow:last-child{border-bottom:none}.timer-live{display:grid;gap:4px;text-align:center}.timer-help{font-size:.84rem;color:#bad3e0}.timer-panel .buttons{justify-content:center}

<body>
<div class="shell"><header><div><div class="eyebrow">GYM COMPANION • النسخة التجريبية 1.2.0</div><h1>رفيق الجيم <span style="color:var(--accent)">✦</span></h1></div><span class="pill">محفوظ على الجهاز</span></header><main id="app" aria-live="polite"></main></div>
<nav class="nav" id="nav"><button data-tab="today"><span>⌂</span>اليوم</button><button data-tab="plan"><span>▦</span>جدولي</button><button data-tab="history"><span>◷</span>السجل</button><button data-tab="progress"><span>↗</span>التطور</button><button data-tab="settings"><span>⚙</span>الإعدادات</button></nav>
<div class="toast hidden" id="toast" role="status"></div><input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="./exercise-media.js"></script>
<script>
(()=>{'use strict';
const STORAGE='gym-companion-v1',days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const LIBRARY=[
{id:'qset',name:'تنشيط عضلات الفخذ (Quad Set)',machine:'بدون جهاز / على سطح داعم',area:'الركبة',caution:'لا تحاول فرد الركبة بالقوة. يتطلب توجيه أخصائي التأهيل.'},
{id:'glute',name:'تنشيط عضلات المقعدة (Glute Set)',machine:'بدون جهاز',area:'سفلي',caution:'مقترح للمراجعة وليس وصفة تمرين.'},
{id:'bike',name:'دراجة ثابتة بمسند ظهر',machine:'Recumbent Bike',area:'سفلي',caution:'مدى الحركة والمقاومة وضبط المقعد بعد تقييم الركبة.'},
{id:'chest',name:'ضغط صدر بالجهاز',machine:'Seated Chest Press',area:'علوي',caution:'الكوعان بعد النزيف: يحتاج تصريحًا وتحديد الحمل والمدى.'},
{id:'row',name:'سحب ظهر مدعوم',machine:'Seated Row Machine',area:'علوي',caution:'الكوعان بعد النزيف: يحتاج تصريحًا وتحديد الحمل والمدى.'},
{id:'pulldown',name:'سحب أمامي بالجهاز',machine:'Lat Pulldown',area:'علوي',caution:'أحمال ومدى الكوع والكتف تحتاج مراجعة مختص.'},
{id:'calf',name:'رفع كعبين بدعم ثابت',machine:'حائط أو جهاز مساند',area:'سفلي',caution:'يلزم مراجعة تحمل المفصل والاتزان.'},
{id:'core',name:'تنشيط الجذع الخفيف',machine:'بساط / دعم مناسب',area:'جذع',caution:'اختيار الطريقة بدون إجهاد زائد بعد التقييم.'}
];
const uid=()=> (globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const defaults=()=>({version:1,medicalApproved:false,plans:[{id:'a',name:'الحصة A — الجزء العلوي',weekday:null,items:[{uid:uid(),id:'chest',sets:2,reps:10,approved:false},{uid:uid(),id:'row',sets:2,reps:10,approved:false}]},{id:'b',name:'الحصة B — الجزء السفلي والتأهيل',weekday:null,items:[{uid:uid(),id:'qset',sets:2,reps:8,approved:false},{uid:uid(),id:'glute',sets:2,reps:8,approved:false}]},{id:'c',name:'الحصة C — نشاط منخفض الشدة',weekday:null,items:[{uid:uid(),id:'bike',sets:1,reps:10,approved:false}]}],sessions:[],notes:'',exportedAt:null});
let db;try{const x=JSON.parse(localStorage.getItem(STORAGE));db=x?.version===1&&Array.isArray(x.plans)&&Array.isArray(x.sessions)?x:defaults()}catch{db=defaults()};
let tab='today',selectedPlan=null,readiness={knee:'stable',elbow:'stable',bleed:'no',energy:'normal'},editingPlan=null,libFilter='';
const app=document.getElementById('app');const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(db))}catch{alert('تعذر حفظ البيانات على الجهاز. صدّر نسخة احتياطية الآن.')}};
const notify=(str)=>{const el=document.querySelector('#toast');el.textContent=str;el.classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.add('hidden'),2800)};
const plan=id=>db.plans.find(p=>p.id===id);const ex=id=>LIBRARY.find(x=>x.id===id)||{id,name:'تمرين محذوف',machine:'غير معروف',area:'أخرى',caution:''};
const done=s=>s.status==='done';let demoSession=null;const active=()=>demoSession||db.sessions.find(s=>s.status==='active');
// Guiding durations are not medical prescriptions or proven optimal times.
const timeMode=id=>id==='bike'?'minutes':(id==='qset'||id==='glute')?'hold':'reps';
const defaultTempo=id=>timeMode(id)==='hold'?8:3;
const defaultRest=id=>timeMode(id)==='minutes'?90:120;
const bounded=(v,lo,hi,fallback)=>Number.isFinite(Number(v))&&v!==null&&v!==''?Math.max(lo,Math.min(hi,Math.round(Number(v)))):fallback;
const guidance=(id,reps,tempo)=>timeMode(id)==='minutes'?bounded(reps,1,120,10)*60:bounded(reps,1,200,10)*bounded(tempo,1,15,defaultTempo(id));
const fmtSeconds=n=>{const x=Math.max(0,Math.round(n)||0);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
function elapsedMs(t){return Math.max(0,Number(t.elapsedMs||0)+(t.pausedAt!=null?0:Math.max(0,Date.now()-t.startedAt)))}
function timerPanel(s){const t=s.timer;if(!t)return'';const x=s.exercises?.[t.exIndex],isSet=t.mode==='set';return `<div class="card timer-panel" id="timerPanel"><div class="eyebrow">${isSet?'توقيت المجموعة':'استراحة بين المجموعات'}</div><h3 style="text-align:center;margin:9px 0 0">${esc(x?.name||'استراحة')}</h3><div class="timer-live"><span class="timer-face" id="timerFace">00:00</span><span class="timer-help" id="timerHelp">${isSet?'مدة مستهدفة إرشادية':'مدة الراحة المقترحة'}</span></div><div class="buttons">${t.pausedAt!=null?'<button class="btn secondary" data-act="timer-resume">استكمال التوقيت</button>':'<button class="btn secondary" data-act="timer-pause">إيقاف التوقيت مؤقتًا</button>'}${isSet?'<button class="btn" data-act="timer-complete">إنهاء المجموعة وتسجيل وقتها</button><button class="btn ghost" data-act="timer-cancel">إلغاء التوقيت</button>':'<button class="btn" data-act="timer-rest-end">إنهاء الراحة</button><button class="btn secondary" data-act="timer-rest-more">+30 ثانية</button>'}</div><p class="small" style="text-align:center">${isSet?'التوقيت لا يجبرك على إكمال المجموعة؛ أوقف فورًا عند أعراض غير معتادة.':'الاستراحة مرنة: لا تبدأ مجموعة جديدة إذا لم تتعافَ أو ظهرت أعراض.'}</p></div>`}
function updateTimerDisplay(){const s=active(),t=s?.timer,face=document.getElementById('timerFace'),help=document.getElementById('timerHelp');if(!t||!face||!help)return;const elapsed=Math.floor(elapsedMs(t)/1000);if(t.mode==='set'){face.textContent=fmtSeconds(elapsed);help.textContent=`الهدف الإرشادي: ${fmtSeconds(t.targetSec)} • الوقت الفعلي يُسجّل عند الإنهاء`;}else{const remaining=Math.max(0,t.targetSec-elapsed);face.textContent=fmtSeconds(remaining);help.textContent=remaining===0?'انتهت المدة الإرشادية • قيّم جاهزيتك قبل البدء':`راحة مقترحة ${fmtSeconds(t.targetSec)} • مرّ ${fmtSeconds(elapsed)}`;}}
function closeRest(s){if(s.timer?.mode!=='rest')return;const t=s.timer,z=s.exercises?.[t.exIndex]?.sets?.[t.setIndex];if(z)z.restActualSec=Math.round(elapsedMs(t)/1000);s.timer=null;save()}
function timerAction(action,exIndex,setIndex){const s=active();if(!s)return;if(action==='timer-start'){if(s.postJoint==='changed'||s.postJoint==='suspected')return alert('ظهرت أعراض جديدة بالمفاصل؛ لا تبدأ مجموعة أخرى. أوقف التمرين وتواصل مع فريق العلاج حسب الأعراض.');if(s.timer?.mode==='set')return notify('أكمل أو ألغِ توقيت المجموعة الحالية أولًا');if(s.timer?.mode==='rest')closeRest(s);const x=s.exercises[exIndex],z=x?.sets[setIndex];if(!z||z.status!=='todo')return notify('المجموعة دي مسجلة أو غير موجودة');s.timer={mode:'set',exIndex,setIndex,startedAt:Date.now(),elapsedMs:0,pausedAt:null,targetSec:bounded(z.plannedSec,1,7200,guidance(x.id,z.reps,x.tempoSec))};save();render();return}
const t=s.timer;if(!t)return;if(action==='timer-pause'&&t.pausedAt===null){t.elapsedMs=elapsedMs(t);t.pausedAt=Date.now();save();render();return}if(action==='timer-resume'&&t.pausedAt!==null){t.startedAt=Date.now();t.pausedAt=null;save();render();return}if(action==='timer-cancel'&&t.mode==='set'){s.timer=null;save();render();return}if(action==='timer-complete'&&t.mode==='set'){const x=s.exercises[t.exIndex],z=x?.sets[t.setIndex];if(!z)return;z.durationSec=Math.round(elapsedMs(t)/1000);z.status='done';const pending=s.exercises.some(item=>item.sets.some(v=>v.status==='todo'));s.timer=pending?{...t,mode:'rest',startedAt:Date.now(),elapsedMs:0,pausedAt:null,targetSec:bounded(x.restSec,30,600,defaultRest(x.id))}:null;save();render();notify('اتسجل وقت المجموعة، والراحة بدأت لو فيه مجموعات متبقية');return}if(t.mode==='rest'&&action==='timer-rest-more'){t.targetSec=Math.min(3600,t.targetSec+30);save();render();return}if(t.mode==='rest'&&action==='timer-rest-end'){closeRest(s);render();return}}
setInterval(updateTimerDisplay,500);

function nextPlan(){let s=[...db.sessions].sort((a,b)=>b.started.localeCompare(a.started)).find(s=>s.status==='done'||s.status==='partial'||s.status==='skipped');if(s&&s.status!=='done'&&plan(s.planId))return s.planId;if(s){let idx=db.plans.findIndex(p=>p.id===s.planId);return db.plans[(idx+1)%db.plans.length]?.id}return db.plans[0]?.id}
const next=()=>selectedPlan&&plan(selectedPlan)?selectedPlan:nextPlan();const formatDate=v=>{if(!v)return'';const d=new Date(v.length===10?v+'T12:00:00':v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('ar-EG',{weekday:'short',month:'short',day:'numeric'})};
const badge=s=>({done:'مكتملة',partial:'جزئية',skipped:'فاتت',active:'قيد التنفيذ'})[s]||s;
function navbar(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){navbar();app.innerHTML=({today:renderToday,plan:renderPlan,history:renderHistory,progress:renderProgress,settings:renderSettings}[tab]||renderToday)();updateTimerDisplay()}
function quickStats(){const c=db.sessions.filter(done).length;const partial=db.sessions.filter(s=>s.status==='partial').length;const missed=db.sessions.filter(s=>s.status==='skipped').length;return `<div class="statline"><div class="stat"><strong>${c}</strong><span>حصة مكتملة</span></div><div class="stat"><strong>${partial}</strong><span>حصة جزئية</span></div><div class="stat"><strong>${missed}</strong><span>حصة فائتة</span></div></div>`}
function readinessBlock(){return `<div class="card"><h2>فحص الحالة قبل التمرين</h2><p class="small">التغيرات الجديدة في المفصل أهم من شدة الألم وحدها. الفحص هنا للتوثيق والتنبيه وليس لتشخيص النزيف.</p><div class="field"><label>الركبة الشمال اليوم</label><select id="knee"><option value="stable" ${readiness.knee==='stable'?'selected':''}>نفس الحالة المعتادة، دون أعراض جديدة</option><option value="changed" ${readiness.knee==='changed'?'selected':''}>تيبّس أو تغير جديد عن المعتاد</option><option value="red" ${readiness.knee==='red'?'selected':''}>سخونة / تورم / ألم جديد أو مفاجئ</option></select></div><div class="field"><label>الكوعان اليوم</label><select id="elbow"><option value="stable" ${readiness.elbow==='stable'?'selected':''}>بدون أعراض جديدة</option><option value="changed" ${readiness.elbow==='changed'?'selected':''}>تغير أو تيبّس جديد</option><option value="red" ${readiness.elbow==='red'?'selected':''}>سخونة / تورم / ألم جديد أو مفاجئ</option></select></div><div class="field"><label>هل تشك في وجود نزيف بمفصل أو عضلة؟</label><select id="bleed"><option value="no" ${readiness.bleed==='no'?'selected':''}>لا</option><option value="yes" ${readiness.bleed==='yes'?'selected':''}>نعم / غير متأكد</option></select></div><div class="field"><label>الطاقة والتعافي العام</label><select id="energy"><option value="normal" ${readiness.energy==='normal'?'selected':''}>المستوى المعتاد</option><option value="low" ${readiness.energy==='low'?'selected':''}>إرهاق ملحوظ</option></select></div>${readiness.bleed==='yes'||readiness.knee==='red'||readiness.elbow==='red'?`<div class="alert red"><b>لا تبدأ حصة تدريب.</b> اشتباه النزيف أو الأعراض الجديدة يستدعي إيقاف التحميل واتباع خطة علاج النزيف والتواصل مع فريق الهيموفيليا. الطوارئ عند الأعراض الشديدة.</div>`:readiness.knee==='changed'||readiness.elbow==='changed'||readiness.energy==='low'?`<div class="alert">حالتك اتغيرت اليوم: لا يُنصح بالتقدم في الأوزان أو تنفيذ الخطة تلقائيًا. سجّل يوم راحة أو راجع المختص لتعديل التمرين.</div>`:`<div class="alert good">لا توجد أعراض جديدة مُبلّغ عنها. ده مش تصريح طبي ببدء التمرين.</div>`}</div>`}
function renderToday(){let a=active();const suggested=plan(next());return `<div class="card accent-card"><div class="eyebrow">لوحة اليوم • ${formatDate(dateKey())}</div><h2 style="font-size:1.4rem;margin:9px 0">${a?'عندك حصة قيد التنفيذ':'جاهز لتنظيم الحصة الجاية؟'}</h2><p style="margin:5px 0 0;color:#daf6f0">${a?'كل مجموعة بتتحفظ بمجرد تسجيلها.':`الاقتراح الحالي: ${esc(suggested?.name||'لا يوجد')}`}</p>${quickStats()}</div>${a?renderActive(a):readinessBlock()+`<div class="card"><div class="row"><h2>اقتراح الحصة القادمة</h2><span class="pill">قابل للتعديل</span></div><div class="field"><label>اختار حصة أو غيّر الاقتراح</label><select id="selectedPlan">${db.plans.map(p=>`<option value="${p.id}" ${p.id===next()?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><p class="small">${esc(suggested?.items.map(x=>ex(x.id).name).join(' • ')||'أضف تمارين من الجدول')}</p>${!db.medicalApproved?`<div class="alert">البرنامج لسه غير معتمد طبيًا داخل التطبيق. التمارين المعروضة مقترحات للمراجعة وليست وصفة علاجية.</div>`:''}<div class="buttons"><button class="btn" data-act="start">بدء الحصة</button><button class="btn secondary" data-act="skip">سجّل تأجيل/تفويت</button><button class="btn ghost" data-act="demo">جرّب المؤقت والتسجيل (محاكاة فقط)</button></div></div><div class="card"><h2>توصية من سجلّك</h2><p class="hint">${suggestion()}</p></div>`}`}
function suggestion(){const last=[...db.sessions].sort((a,b)=>b.started.localeCompare(a.started))[0];if(!last)return 'ابدأ بتوثيق تقييمك والتمارين اللي أقرّها المختص. أول حصة هتكون نقطة قياس للبداية.';if(last.status==='active')return 'عندك حصة بدأت ولسه لم تُغلق. كمّلها أو أنهِها كحصة جزئية قبل التخطيط لليوم التالي.';if(last.status==='skipped')return 'أنت سجّلت تفويت/تأجيل آخر حصة. الحصة دي ما اتحسبتش تدريب؛ تقدر تعيد جدولتها بدل تعويضها بمجهود مضاعف.';if(last.status==='partial')return 'الحصة السابقة كانت جزئية. راجع سبب التوقف قبل قرار استكمالها أو إعادة جدولتها، وبدون زيادة تلقائية للأوزان.';return 'آخر حصة خلصت. قارِن تنفيذها بالأعراض والاستشفاء بعد 24–48 ساعة. الأوزان تفضل ثابتة إلى أن تسمح خطة التدرّج المعتمدة بتغييرها.'}
function renderActive(s){let total=0,complete=0;for(const x of s.exercises){total+=x.sets.length;complete+=x.sets.filter(t=>t.status==='done').length}const perc=total?Math.round(complete/total*100):0;return `<div class="card accent-card"><div class="row"><div><h2>${esc(s.planName)}</h2><p class="small">بدأت ${formatDate(s.started)}</p></div><span class="pill">قيد التنفيذ</span></div><div class="row"><b>المجموعات المكتملة</b><b>${complete}/${total}</b></div><div class="bar" style="margin-top:10px"><div style="width:${perc}%"></div></div></div>${s.demo?'<div class="alert">وضع محاكاة للواجهة فقط • لا تمارس أي حركة بناءً على هذه التجربة • لن يتم حفظ المجموعات في سجل التدريب</div>':''}${timerPanel(s)}<div class="alert" style="margin-bottom:14px">زمن المجموعة وسرعتها والراحة إرشادات قابلة للتعديل، وليست معيارًا للكفاءة أو تصريحًا بزيادة الشدة. لا تتسابق مع المؤقت، ولا تحبس النفس أثناء الرفع.</div>${s.exercises.map((x,i)=>`<div class="card"><div class="row"><div><h3>${esc(x.name)}</h3><div class="small">${esc(x.machine)}</div></div><span class="pill">${i+1}</span></div><div class="timing-hint">${timeMode(x.id)==='minutes'?'نشاط مُوقّت: الرقم في خانة التكرارات يمثل دقائق مستهدفة.':timeMode(x.id)==='hold'?'تنشيط/ثبات عضلي: مدة كل دورة تشمل الثبات والاسترخاء، حسب تعليمات أخصائي التأهيل.':'تكرارات مُتحكَّم فيها؛ زمن الدورة قابل للتعديل حسب التقنية والراحة.'} <b>الراحة الإرشادية: ${fmtSeconds(x.restSec??defaultRest(x.id))}</b></div>${window.GymMedia.inline(x.id)}${x.sets.map((set,j)=>`<div class="timingrow"><div class="setrow"><div class="field"><label>الوزن كجم • ${j+1}</label><input type="number" min="0" step="0.25" inputmode="decimal" data-set="weight" data-ex="${i}" data-i="${j}" value="${set.weight??''}" placeholder="—"></div><div class="field"><label>${timeMode(x.id)==='minutes'?'المدة بالدقائق':'التكرارات'}</label><input type="number" min="0" max="500" step="1" data-set="reps" data-ex="${i}" data-i="${j}" value="${set.reps??''}"></div><div class="field"><label>الحالة</label><select data-set="status" data-ex="${i}" data-i="${j}"><option value="todo" ${set.status==='todo'?'selected':''}>لم تنفذ</option><option value="done" ${set.status==='done'?'selected':''}>✓ تمّت</option><option value="skipped" ${set.status==='skipped'?'selected':''}>تخطيت</option></select></div></div><div class="row"><span class="small">⏱ إرشادي: ${fmtSeconds(set.plannedSec??guidance(x.id,set.reps,x.tempoSec))}${set.durationSec!=null?` • <b>فعلي: ${fmtSeconds(set.durationSec)}</b>`:''}${set.restActualSec!=null?` • راحة فعلية: ${fmtSeconds(set.restActualSec)}`:''}</span>${set.status==='todo'?`<button class="btn secondary smallbtn" data-act="timer-start" data-ex="${i}" data-i="${j}" ${s.timer?.mode==='set'?'disabled':''}>ابدأ التوقيت</button>`:''}</div></div>`).join('')}</div>`).join('')}<div class="card"><div class="field"><label>ملاحظات وأعراض الحصة</label><textarea id="sessionNotes" rows="3" placeholder="سبب التوقف، إحساس المفصل، أي ملاحظة...">${esc(s.notes||'')}</textarea></div><div class="field"><label>حالة المفاصل بعد الحصة</label><select id="postJoint"><option value="notchecked" ${s.postJoint==='notchecked'?'selected':''}>لم أقيّم بعد</option><option value="stable" ${s.postJoint==='stable'?'selected':''}>دون أعراض جديدة</option><option value="changed" ${s.postJoint==='changed'?'selected':''}>ظهر تغير جديد</option><option value="suspected" ${s.postJoint==='suspected'?'selected':''}>اشتباه نزيف أو سخونة/تورم/ألم جديد</option></select></div>${s.postJoint==='suspected'||s.postJoint==='changed'?`<div class="alert red">أوقف النشاط واتبع خطة علاج النزيف الخاصة بك عند الاشتباه فيه، واتصل بالفريق العلاجي. لا تبدأ مجموعات أخرى.</div>`:''}<div class="buttons"><button class="btn" data-act="finish">إنهاء وتسجيل الحصة</button><button class="btn secondary" data-act="save-active">حفظ</button></div><p class="small">الوقت يتحفظ لكل مجموعة عند إنهاء المؤقت. التوقيت ممكن يواصل حساب الزمن الصحيح بعد إقفال الشاشة، لكن إشعارات الصوت والخلفية ليست مضمونة على iPhone. كل الإدخالات تُحفظ محليًا.</p></div>`}

function renderPlan(){return `<div class="row"><h2>البرنامج الأساسي</h2><button class="btn secondary smallbtn" data-act="add-plan">+ حصة</button></div><div class="alert" style="margin-bottom:15px">كل الأجهزة أدناه مجرد مرشّحات لمناقشتها مع أخصائي الهيموفيليا والعلاج الطبيعي. لا تبدأها أو ترفع أوزانها دون موافقة مناسبة لحالة الركبة والكوعين.</div>${db.plans.map(p=>`<div class="card"><div class="row"><div><h2>${esc(p.name)}</h2><span class="small">${p.weekday===null?'موعد مرن':days[p.weekday]} • ${p.items.length} تمارين</span></div><button class="btn ghost smallbtn" data-act="edit-plan" data-id="${p.id}">تعديل</button></div><div class="chiprow">${p.items.map(x=>`<span class="pill ${x.approved?'good':'warn'}">${esc(ex(x.id).name)} ${x.approved?'✓':'· مراجعة'}</span>`).join('')||'<span class="small">لم تُضف تمارين</span>'}</div></div>`).join('')}${editingPlan?renderEditor(plan(editingPlan)):''}<div class="card"><h2>قائمة الأجهزة والتمارين المقترحة</h2><p class="small">أمثلة للمراجعة وليست حكمًا بأن كل جهاز مناسب لحالتك.</p><div class="field"><label>بحث</label><input id="libFilter" placeholder="ابحث عن عضلة أو جهاز..." value="${esc(libFilter)}"></div>${LIBRARY.filter(x=>(x.name+' '+x.machine+' '+x.area).toLowerCase().includes(libFilter.toLowerCase())).map(x=>`<div class="item"><div class="itemtitle">${esc(x.name)}</div><div class="small">الجهاز: ${esc(x.machine)} • ${esc(x.area)}</div>${window.GymMedia.preview(x.id)}<p class="small" style="margin:4px 0;color:#ffe1aa">${esc(x.caution)}</p></div>`).join('')}</div>`}
function renderEditor(p){if(!p)return'';return `<div class="card" id="editor"><div class="row"><h2>تعديل الحصة</h2><button class="btn ghost smallbtn" data-act="close-edit">إغلاق</button></div><div class="field"><label>اسم الحصة</label><input id="planName" value="${esc(p.name)}"></div><div class="field"><label>يوم التمرين</label><select id="planWeekday"><option value="" ${p.weekday===null?'selected':''}>مرن (بدون يوم ثابت)</option>${days.map((d,i)=>`<option value="${i}" ${p.weekday===i?'selected':''}>${d}</option>`).join('')}</select></div><p class="small">أوقات التمرين والراحة تحت قابلة للتعديل بناء على الخطة المعتمدة طبيًا. مش هدف إلزامي ولا دليل إن التمرين تم صح.</p>${p.items.map(x=>`<div class="item"><div class="row"><b>${esc(ex(x.id).name)}</b><button class="btn danger smallbtn" data-act="remove-ex" data-id="${p.id}" data-uid="${x.uid}">حذف</button></div>${window.GymMedia.inline(x.id)}<div class="two"><div class="field"><label>عدد المجموعات</label><input type="number" min="1" max="10" data-edit="sets" data-uid="${x.uid}" value="${x.sets}"></div><div class="field"><label>${timeMode(x.id)==='minutes'?'المدة بالدقائق':'تكرارات مستهدفة'}</label><input type="number" min="1" max="200" data-edit="reps" data-uid="${x.uid}" value="${x.reps}"></div></div><div class="two">${timeMode(x.id)!=='minutes'?`<div class="field"><label>ثواني لكل ${timeMode(x.id)==='hold'?'دورة ثبات وراحة':'تكرار'}</label><input type="number" min="1" max="15" data-edit="tempoSec" data-uid="${x.uid}" value="${x.tempoSec??defaultTempo(x.id)}"></div>`:''}<div class="field"><label>الراحة (ثانية)</label><input type="number" min="30" max="600" step="5" data-edit="restSec" data-uid="${x.uid}" value="${x.restSec??defaultRest(x.id)}"></div></div><p class="small">${timeMode(x.id)==='hold'?'ثواني الدورة مجرد مساحة قابلة للضبط حسب إرشادات التأهيل.':timeMode(x.id)==='minutes'?'مدة بالدقائق وليست عدد دورات بدال.':'مثلًا: 3 ثوانٍ للتكرار موزعة على الرفع والإنزال بهدوء، وليس شرطًا مثبتًا لنمو العضلات.'}</p><label class="row" style="justify-content:flex-start"><input type="checkbox" data-edit="approved" data-uid="${x.uid}" ${x.approved?'checked':''}> تمت مراجعة التمرين والجهاز والمدى مع المختص</label></div>`).join('')}<div class="field"><label>إضافة تمرين</label><select id="addExercise"><option value="">اختر من المكتبة</option>${LIBRARY.filter(x=>!p.items.find(y=>y.id===x.id)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="buttons"><button class="btn secondary" data-act="add-ex">إضافة التمرين</button>${db.plans.length>1?`<button class="btn danger" data-act="delete-plan">حذف الحصة</button>`:''}</div></div>`}

function renderHistory(){return `<h2>سجل الحصص</h2>${db.sessions.length? [...db.sessions].sort((a,b)=>b.started.localeCompare(a.started)).map(s=>{const total=s.exercises.reduce((n,x)=>n+x.sets.length,0),comp=s.exercises.reduce((n,x)=>n+x.sets.filter(z=>z.status==='done').length,0);return `<div class="card"><div class="row"><div><h3>${esc(s.planName)}</h3><div class="small">${formatDate(s.started)} • ${comp}/${total} مجموعات مكتملة</div></div><span class="pill ${s.status==='done'?'good':s.status==='active'?'warn':''}">${badge(s.status)}</span></div>${s.reason?`<p class="small">سبب التأجيل: ${esc(s.reason)}</p>`:''}${s.notes?`<p class="small">${esc(s.notes)}</p>`:''}<div class="buttons"><button class="btn secondary smallbtn" data-act="view-session" data-id="${s.id}">عرض التفاصيل</button>${s.status==='active'?`<button class="btn smallbtn" data-tab="today">متابعة</button>`:''}</div><div class="hidden" id="details-${s.id}">${s.exercises.map(x=>`<div class="item"><b>${esc(x.name)}</b> — ${x.sets.filter(z=>z.status==='done').map(z=>`${esc(z.weight??'—')} كجم × ${esc(z.reps)}${z.durationSec!=null?' • '+fmtSeconds(z.durationSec):''}`).join(' | ')||'لا مجموعات مكتملة'}</div>`).join('')}</div></div>`}).join(''):'<div class="card empty">مفيش سجل حتى الآن. هتظهر هنا كل حصة مكتملة أو ناقصة أو متأجلة.</div>'}`}
function renderProgress(){const all=db.sessions.filter(s=>s.status!=='active'),doneS=all.filter(done),countSets=doneS.reduce((n,s)=>n+s.exercises.reduce((m,x)=>m+x.sets.filter(z=>z.status==='done').length,0),0);const volumes=doneS.map(s=>({s,vol:s.exercises.reduce((n,x)=>n+x.sets.filter(z=>z.status==='done').reduce((k,z)=>k+((Number(z.weight)||0)*(Number(z.reps)||0)),0),0)}));const max=Math.max(1,...volumes.map(x=>x.vol));const completed=all.length?Math.round(100*doneS.length/all.length):0;const dateRange=new Date();dateRange.setDate(dateRange.getDate()-28);const recent=all.filter(s=>new Date(s.started)>=dateRange);const adherence=recent.length?Math.round(100*recent.filter(done).length/recent.length):0;return `<h2>لوحة التطور</h2><div class="statline"><div class="stat"><strong>${completed}%</strong><span>إكمال الحصص المسجلة</span></div><div class="stat"><strong>${countSets}</strong><span>مجموعات مكتملة</span></div><div class="stat"><strong>${adherence}%</strong><span>إكمال آخر 28 يومًا*</span></div></div><div class="card"><h2>حجم المقاومة المُسجّل</h2><p class="small">كيلوجرام × تكرارات، للمجموعات ذات الأوزان المسجلة فقط. ليس مقياسًا لسلامة المفصل أو مبررًا لرفع الوزن، ولا يقارن بين أجهزة مختلفة.</p>${volumes.length?volumes.slice(-12).map(x=>`<div class="progressrow"><div class="row"><span class="small">${formatDate(x.s.started)}</span><b>${Math.round(x.vol)}</b></div><div class="bar"><div style="width:${Math.round(100*x.vol/max)}%"></div></div></div>`).join(''):'<div class="empty">أكمل حصص وسجّل الوزن والتكرارات لظهور البيانات.</div>'}</div><div class="card"><h2>متابعة وقت المجموعات</h2><p class="small">نسجّل المدة الفعلية للتمرين وفترات الراحة لمساعدتك على تقييم الاستمرارية. المدة الأطول ليست بالضرورة أفضل، ولا تعني إمكانية زيادة الحمل.</p>${(()=>{const t=db.sessions.flatMap(s=>s.exercises||[]).flatMap(x=>x.sets||[]).filter(z=>z.status==='done'&&z.durationSec!=null);return t.length?`<div class="row"><span>مجموعات بتوقيت مسجل</span><b>${t.length}</b></div><div class="row"><span>متوسط الوقت الفعلي</span><b>${fmtSeconds(t.reduce((a,z)=>a+z.durationSec,0)/t.length)}</b></div>`:'<div class="small">ابدأ مؤقت المجموعة وسجّل وقتها لظهور الإحصائيات.</div>'})()}</div><div class="card"><h2>سلامة المفاصل جزء من التطور</h2><p class="hint">سنسجل بمرور الوقت: الراحة بعد 24–48 ساعة، حدوث أعراض جديدة، ومقياس مدى الحركة من أخصائي التأهيل. لا تستخدم التطبيق لقياس مدى الحركة بالقوة.</p><div class="field"><label>ملاحظات عن الركبة والكوعين / قياسات موثقة من الأخصائي</label><textarea id="generalNotes" rows="4" placeholder="مثلاً: نتيجة تقييم التأهيل أو التاريخ...">${esc(db.notes||'')}</textarea></div></div><p class="small">*هذه النسبة تخص الحصص التي سُجلت، ولا تحسب الأيام التي لم تسجلها تلقائيًا. لا تعني التزامك الكامل بالجدول.</p>`}
function renderSettings(){return `<h2>الضبط والبيانات</h2><div class="card"><h2>توقيت المجموعة والراحة</h2><p class="small">من تبويب «جدولي» اضبط ثواني التكرار أو الثبات ومدة الراحة لكل تمرين. في الحصة اضغط «ابدأ التوقيت»، ثم «إنهاء المجموعة» لتسجيل الزمن الحقيقي. الأرقام أمثلة إرشادية وليست أوقاتًا مثالية للجميع. توقيت الخلفية وإشعارات الصوت على iOS غير مضمونين.</p></div><div class="card"><h2>اعتماد البرنامج طبيًا</h2><p class="small">الحصة لا تبدأ داخل التطبيق إلا بعد تأكيد الموافقة على البرنامج، ومع مراجعة كل تمرين على حدة. التطبيق لا يحدد احتياج عامل التجلط أو الجرعات.</p><label class="row" style="justify-content:flex-start;align-items:flex-start"><input type="checkbox" id="medicalApproved" ${db.medicalApproved?'checked':''}><span>ناقشت البرنامج مع طبيب الهيموفيليا وأخصائي العلاج الطبيعي، وتمت الموافقة على التدريب بالشروط المحددة لي.</span></label><div class="alert" style="margin-top:12px">إذا حدث نزيف جديد أو ظهرت أعراض غير معتادة، التقييم السابق لا يلغي ضرورة إيقاف التمرين ومراجعة خطة العلاج.</div></div><div class="card"><h2>ذاكرة التطبيق والنسخ الاحتياطي</h2><p class="small">النسخة دي تحفظ على الجهاز والمتصفح الحالي فقط، من غير حساب أو مزامنة سحابية. مسح بيانات الموقع أو تغيير الجهاز قد يؤدي لفقد السجل.</p><div class="buttons"><button class="btn" data-act="export">تنزيل نسخة JSON</button><button class="btn secondary" data-act="import">استيراد نسخة</button><button class="btn danger" data-act="reset">مسح البيانات</button></div><p class="small">${db.exportedAt?'آخر تصدير: '+formatDate(db.exportedAt):'لم يتم تصدير نسخة بعد'}</p></div><div class="card"><h2>ماذا ستضيف النسخة السحابية؟</h2><p class="small">حساب خاص • حفظ متزامن بين الأجهزة • نسخ احتياطية مشفرة • تنبيهات مواعيد • مراجعة النتائج مع الأخصائي بموافقتك. كل ده يحتاج خدمة استضافة وقاعدة بيانات آمنة.</p></div>`}
function start(){if(active())return notify('أنهِ الحصة الحالية أولًا');const p=plan(next());if(!p||!p.items.length)return notify('اختار حصة فيها تمارين');if(readiness.bleed==='yes'||readiness.knee!=='stable'||readiness.elbow!=='stable'||readiness.energy==='low')return alert('تم إيقاف بدء الحصة بسبب تغير الحالة أو اشتباه النزيف. سجّل التأجيل واستشر فريق العلاج حسب الأعراض.');if(!db.medicalApproved)return alert('قبل بدء الحصة، يلزم تأكيد موافقة الفريق الطبي على البرنامج من الإعدادات.');if(p.items.some(x=>!x.approved))return alert('هناك تمارين لم تُراجع بعد مع المختص. افتح جدولي > تعديل، وسجّل فقط موافقة فعلية على كل تمرين.');const s={id:uid(),planId:p.id,planName:p.name,started:new Date().toISOString(),status:'active',readiness:{...readiness},postJoint:'notchecked',notes:'',exercises:p.items.map(x=>{const l=ex(x.id);return {id:x.id,name:l.name,machine:l.machine,tempoSec:bounded(x.tempoSec,1,15,defaultTempo(x.id)),restSec:bounded(x.restSec,30,600,defaultRest(x.id)),sets:Array.from({length:x.sets},(_,i)=>{const prev=[...db.sessions].reverse().find(s=>s.exercises?.some(z=>z.id===x.id&&z.sets[i]?.status==='done'));const old=prev?.exercises.find(z=>z.id===x.id)?.sets[i];return {weight:old?.weight??null,reps:x.reps,status:'todo',plannedSec:guidance(x.id,x.reps,x.tempoSec??defaultTempo(x.id)),durationSec:null,restActualSec:null}})}})};db.sessions.push(s);save();render();notify('الحصة بدأت • تقدر تسجل المجموعات')}
function startDemo(){if(active())return notify('أنهِ الحصة الحالية أولًا');const e={id:'demo-only',name:'مجموعة تجريبية — بدون أداء حقيقي',machine:'محاكاة المؤقت والتسجيل فقط',tempoSec:3,restSec:60,sets:Array.from({length:2},()=>({weight:null,reps:10,status:'todo',plannedSec:30,durationSec:null,restActualSec:null}))};demoSession={id:'demo-session',demo:true,planId:'demo',planName:'تجربة مؤقت المجموعات',started:new Date().toISOString(),status:'active',postJoint:'notchecked',notes:'',exercises:[e]};render();notify('فتحت واجهة تجربة بدون تسجيل رياضي حقيقي')}
function skip(){const p=plan(next());if(!p)return;const reason=prompt('سبب التأجيل/التفويت (اختياري):','');if(reason===null)return;db.sessions.push({id:uid(),planId:p.id,planName:p.name,started:new Date().toISOString(),status:'skipped',reason,exercises:[]});save();render();notify('اتسجل التأجيل ومش هيتحسب إنجاز')}
function finish(){const s=active();if(!s)return;const total=s.exercises.reduce((n,x)=>n+x.sets.length,0),c=s.exercises.reduce((n,x)=>n+x.sets.filter(z=>z.status==='done').length,0);if(s.postJoint==='suspected'&&!confirm('سجّلت اشتباه نزيف. أوقف التمرين واتبع خطتك العلاجية. هل تريد فقط حفظ الحصة وإغلاقها؟'))return;if(!confirm(`سجلت ${c} من ${total} مجموعات. هل تنهي الحصة الآن؟`))return;if(s.demo){demoSession=null;render();notify('انتهت التجربة • لم يُضاف شيء لسجلّك');return}s.timer=null;s.status=c===total&&total>0?'done':'partial';s.ended=new Date().toISOString();save();render();notify(s.status==='done'?'اتحفظت الحصة مكتملة':'اتحفظت الحصة جزئية')}
function exportData(){db.exportedAt=new Date().toISOString();save();const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gym-companion-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);render();notify('تم تجهيز النسخة الاحتياطية للتنزيل')}
function clickAction(e){const t=e.target.closest('[data-act],[data-tab]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;editingPlan=null;render();window.scrollTo(0,0);return}const id=t.dataset.id;switch(t.dataset.act){case'timer-start':case'timer-pause':case'timer-resume':case'timer-complete':case'timer-cancel':case'timer-rest-end':case'timer-rest-more':timerAction(t.dataset.act,Number(t.dataset.ex),Number(t.dataset.i));break;case'start':start();break;case'demo':startDemo();break;case'skip':skip();break;case'finish':finish();break;case'save-active':save();notify('تم الحفظ');break;case'export':exportData();break;case'import':document.querySelector('#importFile').click();break;case'reset':if(confirm('هل أنت متأكد؟ سيتم حذف كل التمارين والسجل من هذا الجهاز. نزّل نسخة احتياطية أولًا.')){if(confirm('تأكيد أخير: حذف كل بيانات رفيق الجيم؟')){db=defaults();selectedPlan=null;readiness={knee:'stable',elbow:'stable',bleed:'no',energy:'normal'};save();render()}}break;case'add-plan':{const name=prompt('اسم الحصة الجديدة:','حصة جديدة');if(!name?.trim())return;const pid=uid();db.plans.push({id:pid,name:name.trim().slice(0,80),weekday:null,items:[]});editingPlan=pid;save();render();break}case'edit-plan':editingPlan=id;render();document.querySelector('#editor')?.scrollIntoView({behavior:'smooth'});break;case'close-edit':editingPlan=null;render();break;case'add-ex':{const pid=plan(editingPlan),v=document.querySelector('#addExercise')?.value;if(!pid||!v)return notify('اختر تمرينًا');pid.items.push({uid:uid(),id:v,sets:timeMode(v)==='minutes'?1:2,reps:10,tempoSec:defaultTempo(v),restSec:defaultRest(v),approved:false});save();render();break}case'remove-ex':{const pid=plan(id);if(!pid)return;pid.items=pid.items.filter(x=>x.uid!==t.dataset.uid);save();render();break}case'delete-plan':if(db.plans.length>1&&confirm('حذف الحصة من الجدول؟ السجل القديم سيبقى محفوظًا.')){db.plans=db.plans.filter(x=>x.id!==editingPlan);editingPlan=null;selectedPlan=null;save();render()}break;case'view-session':document.getElementById('details-'+id)?.classList.toggle('hidden');break}}
function handleChange(e){const t=e.target;let s=active();if(t.id==='selectedPlan'){selectedPlan=t.value;render();return}if(['knee','elbow','bleed','energy'].includes(t.id)){readiness[t.id]=t.value;render();return}if(t.dataset.set&&s){const x=s.exercises[Number(t.dataset.ex)]?.sets[Number(t.dataset.i)];if(!x)return;if(t.dataset.set==='status'){x.status=t.value;if(s.timer?.mode==='set'&&s.timer.exIndex===Number(t.dataset.ex)&&s.timer.setIndex===Number(t.dataset.i)){if(t.value==='done')x.durationSec=Math.round(elapsedMs(s.timer)/1000);s.timer=null;}}else{x[t.dataset.set]=t.value===''?null:Math.max(0,Number(t.value)||0);if(t.dataset.set==='reps'&&x.status==='todo'){const e=s.exercises[Number(t.dataset.ex)];x.plannedSec=guidance(e.id,x.reps,e.tempoSec)}}save();if(t.dataset.set==='status')render();return}if(t.id==='sessionNotes'&&s){s.notes=t.value;save();return}if(t.id==='postJoint'&&s){s.postJoint=t.value;if(t.value==='suspected'||t.value==='changed')s.timer=null;save();render();return}if(t.id==='medicalApproved'){db.medicalApproved=t.checked;save();render();return}if(t.id==='generalNotes'){db.notes=t.value.slice(0,20000);save();return}const p=plan(editingPlan);if(p){if(t.id==='planName'){p.name=t.value.slice(0,80)||'حصة بدون عنوان';save();return}if(t.id==='planWeekday'){p.weekday=t.value===''?null:Number(t.value);save();render();return}if(t.dataset.edit){const z=p.items.find(x=>x.uid===t.dataset.uid);if(!z)return;z[t.dataset.edit]=t.dataset.edit==='approved'?t.checked:bounded(t.value,t.dataset.edit==='restSec'?30:1,t.dataset.edit==='sets'?10:t.dataset.edit==='tempoSec'?15:t.dataset.edit==='restSec'?600:200,t.dataset.edit==='restSec'?120:1);save();return}}if(t.id==='libFilter'){libFilter=t.value;const pos=window.scrollY;render();window.scrollTo(0,pos)}}
app.addEventListener('click',clickAction);document.querySelector('#nav').addEventListener('click',clickAction);app.addEventListener('change',handleChange);app.addEventListener('input',e=>{if(['planName','sessionNotes','generalNotes','libFilter'].includes(e.target.id))handleChange(e)});
document.querySelector('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5e6)throw Error('ملف أكبر من الحد المسموح');const x=JSON.parse(await f.text());if(x.version!==1||!Array.isArray(x.plans)||!Array.isArray(x.sessions))throw Error('صيغة الملف غير مناسبة');if(!confirm('الاستيراد هيستبدل السجل الحالي بالكامل. هل أكمل؟'))return;db=x;save();tab='today';editingPlan=null;render();notify('تم استرجاع السجل')}catch(err){alert('تعذر استيراد الملف: '+err.message)}finally{e.target.value=''}});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
